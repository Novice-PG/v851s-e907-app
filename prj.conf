# ELF name that the Linux remoteproc driver will look up in /lib/firmware.
CONFIG_KERNEL_BIN_NAME="zephyr_e907"

# UART3 is the Linkr Bee bridge port, so printk goes to the RAM console.
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=n
CONFIG_RAM_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_NS16550=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# The whole image runs from the DRAM window at 0x43c00000.
CONFIG_XIP=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024

# MSGBOX transport (E907 side) for rpmsg/OpenAMP
CONFIG_MBOX=y
CONFIG_MBOX_SUNXI_MSGBOX=y
CONFIG_NUM_IRQS=256
CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_SLAVE=y
CONFIG_OPENAMP_MASTER=n

# Linux remoteproc resource table: one rpmsg vdev with two vrings and eight
# buffers per vring.  The generic table lets Linux fill in the vring
# addresses from the vdev0vring0/vdev0vring1 carveouts.
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_VRING_ALIGNMENT=16
